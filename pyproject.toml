[project]
name = "win-alpha-factory"
version = "0.1.0"
description = "Descoberta e validação de fórmulas de sinal para mini índice (WIN)"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "polars>=1.0",
    "pyarrow>=16.0",
    "scipy>=1.13",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
agents = ["langgraph>=0.2", "anthropic>=0.40"]
dev = ["pytest>=8.0", "mypy>=1.11", "ruff>=0.6", "hypothesis>=6.100", "types-PyYAML>=6.0", "scipy-stubs>=1.13"]

[tool.mypy]
strict = true
python_version = "3.12"   # stubs do numpy 2.x usam sintaxe 3.12

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
